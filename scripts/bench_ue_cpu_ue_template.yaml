# ===== OFDM Frame =====
ofdm_frame:
  fft_size: 1024  # FFT size (subcarrier count)
  cp_length: 128  # Cyclic prefix length (samples)
  sync_pos: 1  # Sync symbol index in one frame
  num_symbols: 100  # Number of OFDM symbols per frame
  sensing_symbol_num: 100  # Number of symbols used in sensing processing
  frame_queue_size: 32  # Capacity of the demodulated RX frame queue
  zc_root: 29  # Zadoff-Chu root for sync/preamble
  pilot_positions: [571, 631, 692, 752, 812, 872, 933, 993, 29, 89, 150, 210, 270, 330, 391, 451]  # Comb-pilot subcarrier indices
  midframe_pilot_symbols: []  # Mid-frame BPSK pilot symbol indices; comb-pilot RE keep comb-pilot sequence
  midframe_pilot_seed: 1296453708  # Deterministic mid-frame BPSK pilot seed; must match TX/RX

# ===== CUDA =====
cuda:
  cuda_demod_pipeline_slots: 3  # Number of CUDA demodulation pipeline slots

# ===== Sensing =====
sensing:
  bi_enabled: true  # Enable bistatic sensing processing pipeline
  range_fft_size: 1024  # Range FFT size
  doppler_fft_size: 100  # Doppler FFT size

# ===== RF / Sampling =====
  symbol_stride: 20  # Default STRD applied at startup before runtime commands
rf_sampling:
  sample_rate: 200000000  # Baseband sample rate (Hz)
  bandwidth: 200000000  # Analog bandwidth (Hz), usually same as sample_rate
  center_freq: 2800000000  # RF center frequency (Hz)
  rx_agc_enable: false  # Enable hardware RX AGC driven by delay-spectrum peak
  rx_agc_low_threshold_db: 14.0  # Increase gain when filtered delay-spectrum peak falls below this threshold (dB)
  rx_agc_high_threshold_db: 16.0  # Decrease gain when filtered delay-spectrum peak rises above this threshold (dB)
  rx_agc_max_step_db: 1.0  # Maximum RX gain step per AGC update (dB)
  rx_agc_update_frames: 4  # Apply AGC at most once every N processed frames
  rx_gain: 10  # RX gain (dB)

# ===== USRP Device / Link =====
usrp_device:
  device_args: "addr=192.168.40.2, master_clock_rate=200e6, num_recv_frames=512, num_send_frames=512"  # USRP args
  clock_source: external  # Clock source; internal/external/gpsdo
  time_source: internal  # Time/PPS source; set external together with clock_source for ocxo_mode=pps_phase

# ===== Downlink =====
downlink:
  rx_wire_format: sc16  # Downlink RX wire format; sc16/sc8
  rx_channel: 0  # RX channel index on USRP
  equalizer_mode: mmse  # Communication equalizer inverse mode
  channel_tracking_mode: pilot_phase  # Per-symbol comb-pilot tracking mode
  equalizer_mag_floor: 1e-06  # Lower bound for |H|^2 during channel inversion
  channel_tracking_min_pilot_snr: 0.0001  # Minimum comb-pilot residual power accepted by per-symbol tracking
  arq_enabled: false  # Enable downlink ARQ on the UE receiver
  arq_ordered_delivery: false  # Buffer downlink packets for in-order UDP delivery
  arq_window_packets: 256  # Downlink ARQ receive/reorder window [1, 32767]
  arq_feedback_interval_ms: 10  # Downlink ARQ ACK feedback interval in ms
  downlink_cpu_cores: [6, 10, 12]  # UE downlink CPU cores: [rx_proc, process_proc, bit_processing_proc]
  sensing_cpu_cores: [11]  # UE bistatic sensing CPU cores: [sensing_process_proc]

# ===== Uplink =====
uplink:
  symbol_start: 90  # TDD first uplink symbol in the downlink frame
  symbol_count: 10  # TDD uplink window length in OFDM symbols
  guard_symbols: 1  # Leading TDD guard symbols inside the uplink window
  wire_format_tx: sc16  # Uplink TX wire format; sc16/sc8
  arq_enabled: false  # Enable uplink ARQ on the UE transmitter
  arq_window_packets: 256  # Uplink ARQ outstanding packet window [1, 32767]
  arq_retransmit_timeout_ms: 100  # Uplink ARQ retransmit timeout in ms
  arq_max_retries: 5  # Uplink ARQ max retransmit retries; 0 = unlimited within window
  uplink_cpu_cores: []  # UE uplink CPU cores: [UplinkTxEngine LDPC encode, modulation, TX send]

# ===== Sync / Tracking =====
sync_tracking:
  sync_queue_size: 32  # Capacity of the sync-search batch queue
  reset_hold_s: 0.5  # Persistent invalid-delay duration before forcing a hard reset (s)
  software_sync: true  # Enable software sync tracking
  hardware_sync: false  # Enable hardware sync mode
  hardware_sync_tty: /dev/ttyUSB0  # Serial device used by hardware sync controller
  ocxo_mode: auto  # OCXO discipline mode: auto | freq | phase | pps_phase
  ocxo_dac_ppm_per_lsb: 9.708797e-7  # Calibrated DAC ppm per LSB (MV197 map)
  ocxo_dac_zero_word: 493367  # DAC word corresponding to 0 ppm
  ocxo_dac_state_file: .openisac_ocxo_dac_state.yaml  # Persist the last acknowledged DAC word across UE restarts
  ocxo_max_abs_ppm: 0.45  # Absolute OCXO command clamp (ppm)
  ocxo_actuator_max_slew_ppm_per_s: 0.01  # Hard actuator slew limit (ppm/s)
  ocxo_coarse_enable: true  # Arm startup one-target correction after reset
  ocxo_coarse_gain: 1.0  # Coarse target gain on selected frequency error
  ocxo_coarse_max_abs_ppm: 0.2  # Max coarse target offset (ppm)
  ocxo_coarse_obs_window_s: 1.0  # Observation window: Mode A CFO average; Mode B TO regression (s)
  ocxo_coarse_control_period_s: 0.5  # Coarse update period (s)
  ocxo_coarse_max_slew_ppm_per_s: 0.01  # Coarse target tracking slew (ppm/s)
  ocxo_fll_fast_obs_window_s: 1.0  # Fast window: Mode A CFO average; Mode B TO regression (s)
  ocxo_fll_fast_control_period_s: 0.5  # Fast FLL update period (s)
  ocxo_fll_fast_control_mode: pi  # pi | half_step (half the error per update)
  ocxo_fll_fast_kp: 0.5  # Fast FLL proportional gain
  ocxo_fll_fast_ki: 0.03  # Fast FLL integral gain
  ocxo_fll_fast_max_slew_ppm_per_s: 0.005  # Fast FLL slew (ppm/s)
  ocxo_fll_slow_obs_window_s: 10.0  # Slow window: Mode A CFO average; Mode B TO regression (s)
  ocxo_fll_slow_control_period_s: 2.0  # Slow FLL update period (s)
  ocxo_fll_slow_kp: 0.1  # Slow FLL proportional gain
  ocxo_fll_slow_ki: 0.007  # Slow FLL integral gain
  ocxo_fll_slow_deadzone_ppm: 5.0e-5  # Slow FLL residual deadzone (ppm)
  ocxo_fll_slow_max_slew_ppm_per_s: 0.005  # Slow FLL slew limit (ppm/s)
  ocxo_fll_slow_enter_abs_ppm: 0.0005  # Fast-to-slow residual threshold (ppm)
  ocxo_fll_fast_enter_abs_ppm: 0.01  # Slow-to-fast threshold (ppm)
  ocxo_fll_switch_hold_s: 30.0  # Fast-to-slow dwell (s)
  ocxo_phase_control_period_s: 5.0  # Phase control period (s)
  ocxo_phase_jump_gate_samples: 0.5  # Unknown TO_clock jump reject gate (samples)
  ocxo_phase_max_report_age_frames: 256  # Max eRTM TO age accepted for phase lock
  ocxo_phase_setpoint_mode: freeze_on_lock  # Legacy auto/phase target: freeze_on_lock | zero | fixed
  ocxo_phase_setpoint_fixed_samples: 0.0  # Legacy fixed TO_clock target when mode=fixed
  ocxo_pps_initial_ap_enable: true  # One PPSOUT coarse phase placement on every Phase entry
  ocxo_pps_initial_ap_max_abs_ns: 500000000.0  # AP clamp; PPSDO hardware range is +/-0.5 s
  ocxo_pps_initial_ap_settle_s: 2.0  # Wait for adjusted PPS plus a fresh eRTM phase observation
  ocxo_pps_initial_ap_command_timeout_s: 3.0  # Max wait for AP completion before releasing Phase SF
  ocxo_pps_initial_ap_max_retries: 1  # Bounded retries after AP success but no fresh post-AP PPS publication
  ocxo_pps_initial_ap_deadzone_ns: 10.0  # Skip AP/settle when PPS error is already within this range
  ocxo_pps_initial_ap_polarity: 1  # Bench-confirmed AP command sign for positive (P_U-P_B)
  ocxo_phase_kp: 2.0e-4  # Velocity-form Phase PI proportional gain (ppm per sample)
  ocxo_phase_ki: 1.0e-6  # Velocity-form Phase PI integral gain ((ppm/s) per sample)
  ocxo_phase_max_slew_ppm_per_s: 5.0e-5  # Phase loop slew (ppm/s)
  ocxo_phase_enter_sfo_abs_ppm: 2.0e-4  # Slow-window TO regression threshold to enter Phase (ppm)
  ocxo_phase_enter_hold_s: 30.0  # Stable slow-window TO regression dwell before Phase (s)
  ocxo_phase_exit_sfo_abs_ppm: 0.01  # Slow-window TO regression threshold to exit Phase (ppm)
  ocxo_phase_exit_hold_s: 10.0  # Confirmed Phase exit dwell (s; minimum 10)
  cfo_ewma_enable: true  # Enable Mode A EWMA pre-filter on residual CFO ppm
  cfo_ewma_alpha: 0.02  # EWMA weight on new residual_ppm samples (0..1; higher = faster)
  desired_peak_pos: 20  # Target delay-peak index for alignment

# ===== Network =====
network_output:
  bi_sensing_output_enabled: true  # Enable bistatic sensing ZMQ output
  bi_sensing_ip: 0.0.0.0  # Bistatic sensing/control ZMQ bind IP
  bi_sensing_port: 8889  # Bistatic sensing ZMQ output port
  control_port: 10001  # ZMQ port for runtime control commands
  ocxo_debug_ip: 0.0.0.0  # OCXO debug ZMQ bind IP
  ocxo_debug_port: 12347  # OCXO debug ZMQ output port
  channel_ip: 0.0.0.0  # Channel-estimate ZMQ listen IP
  channel_port: 12348  # Channel-estimate output port
  pdf_ip: 0.0.0.0  # Delay-spectrum ZMQ listen IP
  pdf_port: 12349  # Delay-spectrum output port
  constellation_ip: 0.0.0.0  # Constellation ZMQ listen IP
  constellation_port: 12346  # Constellation output port
  udp_output_ip: ""  # UE decoded downlink payload UDP destination IP (empty = use default_out_ip)
  udp_output_port: 50001  # UE decoded downlink payload UDP destination port

# ===== Runtime / Debug =====
runtime:
  main_cpu_core: 13  # Main-thread CPU core (-1 disables explicit binding)

logging:
  default_level: warn
  timestamps: false
  force_error: true
  modules: {}
